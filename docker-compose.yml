
services:
  app:
    image: devops-assessment:1.0.0
    container_name: devops-assessment-app

    ports:
      - "18081:8000"

    environment:
      PORT: "8000"
      LOG_LEVEL: "INFO"
      ENVIRONMENT: "production"
      APP_VERSION: "1.0.0"

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

    security_opt:
      - no-new-privileges:true
